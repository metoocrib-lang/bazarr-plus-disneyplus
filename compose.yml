name: bazarrplus-disneyplus
services:
  disney-agent:
    build: .
    image: bazarr-plus-disneyplus-agent:0.2.2
    init: true
    restart: unless-stopped
    environment:
      BRIDGE_API_TOKEN: ${BRIDGE_API_TOKEN:?Set BRIDGE_API_TOKEN in .env}
      VNC_PASSWORD: ${VNC_PASSWORD:?Set VNC_PASSWORD in .env}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    shm_size: 1gb
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6082}:6080"
    volumes:
      - browser:/data/browser
      - state:/data/state
    networks:
      - private
      - egress
    healthcheck:
      test: ["CMD", "python", "-m", "extractor.manage", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
networks:
  private:
    name: bazarrplus-disneyplus-private
    internal: true
  egress: {}
volumes:
  browser: {}
  state: {}
